<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Une Tierra, Luna y Sol</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#dff4ff,#fff8e9);color:#24375b}main{max-width:1050px;margin:auto;padding:24px 18px 40px;text-align:center}h1{display:inline-block;margin:8px 0 10px;padding:12px 30px;border-radius:22px;background:#304c7d;color:white;font-size:clamp(27px,5vw,46px);box-shadow:0 5px #22385e}.subtitle{font-size:21px;font-weight:700;margin:10px auto 24px}.board{display:grid;grid-template-columns:1fr 1fr;gap:22px}.words,.targets{display:grid;gap:16px}.title{font-size:20px;font-weight:900;margin-bottom:3px}.word{width:100%;min-height:70px;border:4px dashed #7cae9a;border-radius:22px;background:#e8f7e8;color:#27436d;font-size:27px;font-weight:900;cursor:grab;box-shadow:0 4px #b7d8bf}.word:disabled{opacity:.45}.target{min-height:145px;border:4px dashed #82b9d5;border-radius:28px;background:#ffffffdd;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;transition:.15s;box-shadow:0 4px #c5dce7}.target.over{transform:scale(1.02);background:#eaf9ff;border-color:#3f96c7}.target.correct{border-style:solid;border-color:#55a86c;background:#edfff1}.target.wrong{animation:shake .25s}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}svg{width:145px;height:145px;flex:none}.label{font-size:22px;font-weight:900}.hint{font-size:15px;font-weight:700}.message{min-height:38px;margin:20px 0 8px;font-size:22px;font-weight:900}.reset{border:0;border-radius:18px;background:#304c7d;color:#fff;padding:13px 24px;font-size:18px;font-weight:900}@media(max-width:700px){.board{grid-template-columns:1fr}svg{width:115px;height:115px}.target{min-height:125px}}
</style></head><body><main>
<h1>🚀 Une cada palabra con su astro ⭐</h1><div class="subtitle">Arrastra cada palabra hasta la imagen correspondiente.</div>
<div class="board"><section><div class="title">🧩 Palabras</div><div class="words" id="words"></div></section><section><div class="title">🌌 ¡Busca a tu amigo!</div><div class="targets" id="targets"></div></section></div>
<div class="message" id="message" aria-live="polite"></div><button class="reset" id="reset" type="button">🔄 Jugar otra vez</button></main>
<script>
const D=[["TIERRA","earth"],["LUNA","moon"],["SOL","sun"]],W=document.querySelector("#words"),T=document.querySelector("#targets"),M=document.querySelector("#message");
function svg(t){if(t==="earth")return `<svg viewBox="0 0 180 180" aria-label="Tierra"><defs><clipPath id="c"><circle cx="90" cy="90" r="66"/></clipPath><radialGradient id="e"><stop stop-color="#74d4ff"/><stop offset="1" stop-color="#1685c4"/></radialGradient></defs><circle cx="90" cy="90" r="70" fill="#b8e9ff" opacity=".5"/><circle cx="90" cy="90" r="66" fill="url(#e)" stroke="#276a96" stroke-width="3"/><g clip-path="url(#c)" fill="#4eaa62"><path d="M30 72c15-13 24-8 32-18l19 3 4 15-14 11-3 18-19 4-9-13-14-4z"/><path d="M84 42l15-8 16 7 8 17-9 11-14-4-9 8-11-12z"/><path d="M109 91l22-7 21 14-8 16-20-2-8 15-18-5-5-15z"/><path d="M54 119l15-8 13 8 4 18-15 10-17-8z"/></g><g fill="#fff" opacity=".8"><path d="M36 51c17-10 31-10 43-2l-10 7-21-2z"/><path d="M101 121c19-7 32-5 42 4l-13 7-23-2z"/></g>${face()}</svg>`;
if(t==="moon")return `<svg viewBox="0 0 180 180" aria-label="Luna"><defs><radialGradient id="m"><stop stop-color="#f3f3f3"/><stop offset="1" stop-color="#aaa"/></radialGradient></defs><circle cx="90" cy="90" r="68" fill="url(#m)" stroke="#858585" stroke-width="3"/><g fill="#929292" opacity=".7"><circle cx="54" cy="54" r="11"/><circle cx="119" cy="47" r="8"/><circle cx="137" cy="88" r="14"/><circle cx="48" cy="105" r="9"/><circle cx="82" cy="133" r="13"/><circle cx="113" cy="119" r="7"/><circle cx="74" cy="72" r="6"/></g><g fill="none" stroke="#777" stroke-width="3"><circle cx="54" cy="54" r="16"/><circle cx="137" cy="88" r="19"/><circle cx="82" cy="133" r="17"/></g>${face()}</svg>`;
return `<svg viewBox="0 0 180 180" aria-label="Sol"><g fill="#ffb52e"><path d="M90 5l9 28-9 13-9-13z"/><path d="M90 175l-9-28 9-13 9 13z"/><path d="M5 90l28-9 13 9-13 9z"/><path d="M175 90l-28-9-13 9 13 9z"/><path d="M30 30l27 13 2 15-15-2z"/><path d="M150 150l-27-13-2-15 15 2z"/><path d="M150 30l-13 27-15 2 2-15z"/><path d="M30 150l13-27 15-2-2 15z"/></g><circle cx="90" cy="90" r="61" fill="#ffd34f" stroke="#f09d24" stroke-width="3"/><path d="M52 66q10-12 20 0M108 66q10-12 20 0" fill="none" stroke="#9b6b25" stroke-width="5" stroke-linecap="round"/>${face()}</svg>`}
function face(){return `<circle cx="67" cy="91" r="11" fill="#fff"/><circle cx="113" cy="91" r="11" fill="#fff"/><circle cx="68" cy="94" r="5" fill="#27344e"/><circle cx="114" cy="94" r="5" fill="#27344e"/><path d="M78 111 Q90 124 102 111" fill="none" stroke="#27344e" stroke-width="5" stroke-linecap="round"/><circle cx="52" cy="110" r="8" fill="#f29c9c" opacity=".75"/><circle cx="128" cy="110" r="8" fill="#f29c9c" opacity=".75"/>`}
function render(){W.innerHTML="";T.innerHTML="";M.textContent="";[...D].sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement("button");b.className="word";b.textContent=x[0];b.draggable=true;b.dataset.n=x[0];b.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",x[0]));W.append(b)});[...D].sort(()=>Math.random()-.5).forEach(x=>{let t=document.createElement("div");t.className="target";t.dataset.n=x[0];t.innerHTML=svg(x[1])+`<div><div class="label">${x[0]}</div><div class="hint">¡Déjame mi palabra!</div></div>`;t.ondragover=e=>{e.preventDefault();t.classList.add("over")};t.ondragleave=()=>t.classList.remove("over");t.ondrop=e=>{e.preventDefault();t.classList.remove("over");check(e.dataTransfer.getData("text/plain"),x[0],t)};T.append(t)})}
function check(w,n,t){if(t.classList.contains("correct"))return;if(w===n){t.classList.add("correct");let b=[...document.querySelectorAll(".word")].find(x=>x.dataset.n===w);if(b)b.disabled=true;M.textContent=document.querySelectorAll(".correct").length===3?"🎉 ¡Fantástico! ¡Has unido Tierra, Luna y Sol!":"⭐ ¡Muy bien! ¡Has acertado!";}else{M.textContent="💭 ¡Casi! Mira bien y prueba otra vez.";t.classList.add("wrong");setTimeout(()=>t.classList.remove("wrong"),300)}}
document.querySelector("#reset").onclick=render;render();
</script></body></html>
